name: CI
on:
  push:
    branches:
      # - develop
      - master
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
  # pull_request:
  #   paths-ignore:
  #     - '**.md'
  # Dispatch or Manual triggers
  workflow_dispatch:
    inputs:
      clear-native-cache:
        description: 'Bust native .cxx cache (poisoned empty meson arg / chmod)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'
    environment: Primary
    timeout-minutes: 120
    outputs:
      commit_count: ${{ steps.current_commit.outputs.COMMIT_COUNT }}

    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # external/llamatik nests llama.cpp as a submodule of its own, so the checkout must be recursive.
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printenv GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set; skipping (build will use dummy if needed)"
          fi

      - name: Write client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            printenv GOOGLE_CLIENT_SECRETS_JSON | base64 -d > app/src/main/assets/client_secrets.json
          else
            echo "GOOGLE_CLIENT_SECRETS_JSON not set; skipping"
          fi

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build_push.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Vulkan headers for the MTL on-device LLM
        run: |
          # :llamatik-native compiles ggml's Vulkan backend, which needs a shader compiler
          # plus Vulkan-Hpp and SPIRV-Headers. None of those are usable from the Android
          # SDK: the NDK hides its bundled glslc from find_package(Vulkan), and no SDK ships
          # Vulkan-Hpp. wsl-setup.sh does the same staging the local WSL build uses, and its
          # NDK probe also matches this runner's SDK location. Keep in sync with
          # llamatik-native/BUILD.md.
          sudo apt-get update
          sudo apt-get install -y glslc
          bash llamatik-native/wsl-setup.sh --headers-only
          glslc --version
          test -f /opt/vulkan-headers/vulkan/vulkan.hpp
          test -f /opt/vulkan-headers/vk_video/vulkan_video_codec_av1std.h

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config ninja-build cmake python3 python3-pip nasm gperf libltdl-dev libglib2.0-dev texinfo ccache
          pip3 install --upgrade meson  # apt meson 1.3.2 is too old for glib 2.89.0 (>=1.4.0); pip gives 1.7.0
          cmake --version
          meson --version
          ninja --version
          pkg-config --version
          nasm --version
          ccache --version

      - name: Add swap space (8GB)
        run: |
          if swapon --show | grep -q /swapfile; then
            echo "Swap already active"
          else
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Install Android SDK CMake 3.22.1
        run: |
          echo "Installing cmake 3.22.1 via sdkmanager..."
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -f "$SDKMGR" ]; then SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1); fi
          if [ -f "$SDKMGR" ]; then
            echo "Found sdkmanager at $SDKMGR"
            yes | "$SDKMGR" --install "cmake;3.22.1" || yes | sudo "$SDKMGR" --install "cmake;3.22.1" || echo "sdkmanager install failed, will try alternative"
            "$SDKMGR" --list | grep cmake || true
          else
            echo "sdkmanager not found, searching SDK..."
            ls -R "$ANDROID_HOME" 2>/dev/null | head -n 50 || true
            ls -R "$ANDROID_SDK_ROOT" 2>/dev/null | head -n 50 || true
          fi
          ls -d "$ANDROID_HOME/cmake/3.22.1" 2>/dev/null && echo "cmake 3.22.1 installed" || echo "cmake dir not found, checking alternatives"
          ls -d "$ANDROID_SDK_ROOT/cmake/3.22.1" 2>/dev/null && echo "cmake 3.22.1 installed (SDK_ROOT)" || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('external/imagedecoder-houri/library/src/main/cpp/**', 'gradle/libs.versions.toml', 'external/webgpuviewer-houri/library/src/main/cpp/**') }}
          max-size: 2G
          verbose: 1

      - name: Clean stale native cache (bust poisoned .cxx)
        run: |
          echo "Checking for poisoned native cache..."
          if [ "${{ inputs.clear-native-cache }}" == "true" ]; then
              echo "Manual bust requested via workflow_dispatch, removing .cxx"
              rm -rf external/imagedecoder-houri/library/.cxx
            elif [ -d "external/imagedecoder-houri/library/.cxx" ]; then
            if grep -rq 'meson ""' external/imagedecoder-houri/library/.cxx 2>/dev/null; then
              echo "Detected stale empty meson arg, removing .cxx"
              rm -rf external/imagedecoder-houri/library/.cxx
            fi
            if grep -rq 'cross-file=$' external/imagedecoder-houri/library/.cxx 2>/dev/null; then
              echo "Empty cross-file detected, cleaning .cxx"
              rm -rf external/imagedecoder-houri/library/.cxx
            fi
          fi

      - name: Cache native build (.cxx only, exact match)
        uses: actions/cache@v4
        with:
          path: external/imagedecoder-houri/library/.cxx
          key: ${{ runner.os }}-native-${{ hashFiles('external/imagedecoder-houri/library/src/main/cpp/**', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-cleanup: on-success
          addJobSummary: onFailure

      - name: Check code format
        run: ./gradlew spotlessCheck


      # Split flavors into sequential steps: with --parallel a single invocation can
      # overlap both flavors' R8 minify tasks (preview initWith release, shrink on),
      # doubling peak heap and OOMing the runner. Sequential steps peak at one R8.
      - name: Build app (mtl)
        run: ./gradlew assembleMtlPreview -Pinclude-telemetry -Penable-updater --build-cache --max-workers=4
        env:
          CCACHE_DIR: /home/runner/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          JAVA_TOOL_OPTIONS: -Xmx4g

      - name: Build app (nomtl)
        run: ./gradlew assembleNomtlPreview -Pinclude-telemetry -Penable-updater --build-cache --max-workers=4
        env:
          CCACHE_DIR: /home/runner/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          JAVA_TOOL_OPTIONS: -Xmx4g

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest --build-cache --parallel

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Sign APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/mtl/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Sign nomtl APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/nomtl/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      # Beta assets use the same shape as a stable release (Houri-<abi>-<tag>.apk), with the
      # commit-count tag the preview updater compares against. ReleaseServiceImpl finds the
      # matching APK by the "-<abi>-" segment, so every asset has to keep it.
      - name: Rename apk
        id: current_commit
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          mv app/build/outputs/apk/mtl/preview/app-mtl-arm64-v8a-preview-signed.apk Houri-arm64-v8a-r$commit_count.apk
          mv app/build/outputs/apk/mtl/preview/app-mtl-armeabi-v7a-preview-signed.apk Houri-armeabi-v7a-r$commit_count.apk
          mv app/build/outputs/apk/mtl/preview/app-mtl-x86-preview-signed.apk Houri-x86-r$commit_count.apk
          mv app/build/outputs/apk/mtl/preview/app-mtl-x86_64-preview-signed.apk Houri-x86_64-r$commit_count.apk
          mv app/build/outputs/apk/nomtl/preview/app-nomtl-arm64-v8a-preview-signed.apk Houri-nomtl-arm64-v8a-r$commit_count.apk
          mv app/build/outputs/apk/nomtl/preview/app-nomtl-armeabi-v7a-preview-signed.apk Houri-nomtl-armeabi-v7a-r$commit_count.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Houri-preview-r${{ steps.current_commit.outputs.COMMIT_COUNT }}
          path: ./*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/mtl/preview

  # Every master push publishes the build the job above already compiled as the next beta.
  #
  # The betas used to be raw `assembleDebug` APKs: unminified, with debug symbols and no R8, so a
  # low-end device spent 30-40s opening the beta where stable took 10 (issue #78). A preview
  # build is `initWith(release)`: minified, shrunk and signed the same way, which is what gets
  # published here — the difference between the two channels is the tag and the repository, not
  # the kind of build.
  #
  # Requires the `BETA_RELEASE_TOKEN` repository secret: a token that can write releases in
  # `PineappleTwilight/houri-beta` (the default GITHUB_TOKEN only reaches this repository). Until
  # it is set the job warns and skips, so master stays green.
  publish-beta:
    name: Publish beta release
    needs: build
    runs-on: 'ubuntu-24.04'
    # Pushes only, and only from master: a manual dispatch of an older ref must not take over a
    # newer beta tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Houri-preview-r${{ needs.build.outputs.commit_count }}

      - name: Beta notes
        env:
          BETA_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # The previous beta's source commit, read from its release name ("Houri beta r123
          # (<sha>)"). The beta repository's own tags point at its own empty commit, so the
          # tag is no guide to what changed; its releases name the app commit they were built
          # from. Skipped when the token is absent, and when that commit is not in this history.
          prev_sha=""
          if [ -n "$BETA_TOKEN" ]; then
            prev_sha=$(curl -fsSL \
              -H "Authorization: Bearer $BETA_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/PineappleTwilight/houri-beta/releases?per_page=1" \
              | python3 -c 'import json, re, sys; releases = json.load(sys.stdin); match = re.search(r"\(([0-9a-f]{40})\)", releases[0]["name"]) if releases else None; print(match.group(1) if match else "")' \
              || true)
          fi

          if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            {
              echo "Changes since the previous beta:"
              echo
              git log --no-merges --format='- %s (%h)' "$prev_sha..HEAD"
            } > beta_notes.md
          else
            echo "_Built from master; no earlier beta build to compare against._" > beta_notes.md
          fi

          {
            echo
            echo "Built from \`master\` at [\`${GITHUB_SHA::9}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "##### Which APK?"
            echo "- \`Houri-arm64-v8a-*\` — standard build with the on-device AI translation (MTL) engine. Pick this if unsure; it suits most modern devices."
            echo "- \`Houri-armeabi-v7a-*\`, \`Houri-x86_64-*\`, \`Houri-x86-*\` — same MTL build for older ARM or Intel devices."
            echo "- \`Houri-nomtl-*\` — lightweight builds without the MTL engine: smaller download, but AI translation is unavailable."
          } >> beta_notes.md

      - name: Check beta token
        id: token
        env:
          BETA_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: |
          if [ -n "$BETA_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BETA_RELEASE_TOKEN is not set; skipping the beta release."
          fi

      - name: Create beta release
        if: steps.token.outputs.available == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          repository: PineappleTwilight/houri-beta
          tag_name: r${{ needs.build.outputs.commit_count }}
          name: Houri beta r${{ needs.build.outputs.commit_count }} (${{ github.sha }})
          body_path: beta_notes.md
          files: |
            Houri-arm64-v8a-r${{ needs.build.outputs.commit_count }}.apk
            Houri-armeabi-v7a-r${{ needs.build.outputs.commit_count }}.apk
            Houri-x86-r${{ needs.build.outputs.commit_count }}.apk
            Houri-x86_64-r${{ needs.build.outputs.commit_count }}.apk
            Houri-nomtl-arm64-v8a-r${{ needs.build.outputs.commit_count }}.apk
            Houri-nomtl-armeabi-v7a-r${{ needs.build.outputs.commit_count }}.apk
          draft: false
          # Must stay false: the in-app updater reads /releases/latest, and GitHub's "latest"
          # endpoint never returns a prerelease.
          prerelease: false
          make_latest: true
          token: ${{ secrets.BETA_RELEASE_TOKEN }}
